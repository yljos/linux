dns:
  enable: true
  prefer-h3: false
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - localhost.ptlogin2.qq.com
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.googleapis.com"
    - "+.googleapis.cn"
    - "rule-set:googlefcm-site"
    - "rule-set:cloudflare-site"
tun:
  enable: true
  device: clash
  stack: gvisor
  dns-hijack: ["0.0.0.0:53"]
  auto-route: true
  udp-timeout: 60
  mtu: 1500
  auto-detect-interface: true
  auto-redirect: true
  strict-route: true

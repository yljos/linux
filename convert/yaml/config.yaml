mixed-port: 12138
allow-lan: true
bind-address: "*"
find-process-mode: "off"
log-level: error
ipv6: false
udp: true
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: true
  store-fake-ip: true
external-controller: 127.0.0.1:9090
external-ui: ui
external-ui-url: https://www.346211.xyz/dist.zip
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain: [Mijia Cloud]
dns:
  enable: true
  prefer-h3: false
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: redir-host
  use-hosts: true
  default-nameserver: [223.5.5.5#DIRECT]
  proxy-server-nameserver: ["https://dns.alidns.com/dns-query#DIRECT"]
  nameserver: ["https://cloudflare-dns.com/dns-query#M"]
  direct-nameserver: ["https://dns.alidns.com/dns-query#DIRECT"]
  nameserver-policy:
    "rule-set:microsoft-site": "https://cloudflare-dns.com/dns-query#Microsoft"
    "rule-set:cloudflare-site": "https://cloudflare-dns.com/dns-query#M"
    "rule-set:openai-site": "https://cloudflare-dns.com/dns-query#OpenAi"
    "rule-set:github-site": "https://cloudflare-dns.com/dns-query#GitHub"
    "rule-set:telegram-site": "https://cloudflare-dns.com/dns-query#Telegram"
    "rule-set:twitter-site": "https://cloudflare-dns.com/dns-query#Twitter"
    "rule-set:tiktok-site": "https://cloudflare-dns.com/dns-query#TikTok"
    "rule-set:youtube-site": "https://dns.google/dns-query#Google"
    "rule-set:googlefcm-site": "https://dns.google/dns-query#Google"
    "rule-set:google-site": "https://dns.google/dns-query#Google"
    "rule-set:speedtest-site": "https://cloudflare-dns.com/dns-query#M"
    "rule-set:steam-site": "https://cloudflare-dns.com/dns-query#Steam"
    "rule-set:huawei-site": "rcode://refused"
    "rule-set:codeberg-site": "https://cloudflare-dns.com/dns-query#GitHub"

proxies: []

proxy-groups:
  - {type: select, name: M, proxies: [JP, SG, US, HK]}
  - {type: select, name: Default, proxies: [REJECT, DIRECT, M]}
  - {type: select, name: Google, proxies: [US, JP, SG, HK, GCP-outbound]}
  - {type: fallback, name: Relay, include-all-proxies: true, filter: "(?i).*(SG|Singapore|JP|Japan|United States|US|Hong Kong|HK).*", url: "http://www.gstatic.com/generate_204", interval: 30}
  - {type: select, name: OpenAi, proxies: [JP, SG, US, HK]}
  - {type: select, name: Telegram, proxies: [JP, SG, US, HK]}
  - {type: select, name: Steam, proxies: [DIRECT, JP, SG, US, HK]}
  - {type: select, name: PikPak, proxies: [SG_load-balance, HK_load-balance, SG, JP, US, HK]}
  - {type: select, name: GitHub, proxies: [JP, SG, US, HK]}
  - {type: select, name: Microsoft, proxies: [DIRECT, JP, SG, US, HK]}
  - {type: select, name: TikTok, proxies: [JP]}
  - {type: select, name: Twitter, proxies: [US]}
  - {type: select, name: Youtube, include-all-proxies: true, filter: "(?i)^(?=.*(United States|US))(?!.*(gemini)).*$"}
  - {type: select, name: AD, proxies: [REJECT-DROP, PASS]}
  - {type: url-test, url: "https://www.gstatic.com/generate_204", interval: 30, tolerance: 300, timeout: 3000, max-failed-times: 3, include-all-proxies: true, hidden: true, name: HK, filter: "(?i)^(?=.*(HK|Hong Kong))(?!.*(UDP|HY2)).*$"}
  - {type: url-test, url: "https://www.gstatic.com/generate_204", interval: 30, tolerance: 300, timeout: 3000, max-failed-times: 3, include-all-proxies: true, hidden: true, name: JP, filter: "(?i).*(Japan|JP).*"}
  - {type: url-test, url: "https://www.gstatic.com/generate_204", interval: 30, tolerance: 300, timeout: 3000, max-failed-times: 3, include-all-proxies: true, hidden: true, name: SG, filter: "(?i).*(SG|Singapore).*"}
  - {type: url-test, url: "https://www.gstatic.com/generate_204", interval: 30, tolerance: 300, timeout: 3000, max-failed-times: 3, include-all-proxies: true, hidden: true, name: US, filter: "(?i).*(United States|US).*"}
  - {type: load-balance, url: "https://www.gstatic.com/generate_204", interval: 30, timeout: 3000, max-failed-times: 3, include-all-proxies: true, strategy: round-robin, hidden: true, name: SG_load-balance, filter: "(?i).*(Singapore|SG).*"}
  - {type: load-balance, url: "https://www.gstatic.com/generate_204", interval: 30, timeout: 3000, max-failed-times: 3, include-all-proxies: true, strategy: round-robin, hidden: true, name: HK_load-balance, filter: "(?i).*(Hong Kong|HK).*"}


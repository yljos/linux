mixed-port: 12138
allow-lan: false
bind-address: "*"
find-process-mode: "off"
log-level: error
ipv6: false
udp: true
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: false
  store-fake-ip: true
external-controller: 127.0.0.1:9090
external-ui: ui
external-ui-url: https://raw.githubusercontent.com/yljos/linux/refs/heads/main/rule-set/dist.zip
dns:
  enable: true
  prefer-h3: false
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - +.lan
    - +.local
    - localhost.ptlogin2.qq.com
    - +.msftconnecttest.com
    - +.msftncsi.com
    - +.googleapis.com
    - +.googleapis.cn
    - rule-set:googlefcm-site
  use-hosts: true
  default-nameserver:
    - 223.5.5.5#DIRECT
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query#DIRECT
  nameserver:
    - https://cloudflare-dns.com/dns-query#M
  direct-nameserver:
    - https://dns.alidns.com/dns-query#DIRECT
  nameserver-policy:
    rule-set:microsoft-site: https://cloudflare-dns.com/dns-query#Microsoft
    rule-set:openai-site: https://cloudflare-dns.com/dns-query#OpenAi
    rule-set:steam-site-classical: https://cloudflare-dns.com/dns-query#Steam
    rule-set:github-site: https://cloudflare-dns.com/dns-query#GitHub
    rule-set:codeberg-site: https://cloudflare-dns.com/dns-query#GitHub
    rule-set:telegram-site: https://cloudflare-dns.com/dns-query#Telegram
    rule-set:twitter-site: https://cloudflare-dns.com/dns-query#Twitter
    rule-set:tiktok-site: https://cloudflare-dns.com/dns-query#TikTok
    rule-set:youtube-site: https://dns.google/dns-query#Google
    rule-set:googlefcm-site: https://dns.google/dns-query#Google
    rule-set:google-site: https://dns.google/dns-query#Google
    rule-set:speedtest-site: https://cloudflare-dns.com/dns-query#M
proxies: []
proxy-groups:
  - type: fallback
    hidden: true
    name: M
    proxies:
      - SG
      - JP
    url: "https://www.gstatic.com/generate_204"
    interval: 30
  - type: select
    name: Default
    proxies:
      - REJECT
      - DIRECT
      - M
  - type: select
    hidden: true
    name: Google
    include-all-proxies: true
    filter: "(?i)^(?=.*gemini)(?=.*us)"
    proxies:
      - US
      - JP
      - SG
      - HK
  - type: select
    hidden: true
    name: OpenAi
    proxies:
      - JP
      - SG
      - US
      - HK
  - type: select
    hidden: true
    name: Telegram
    proxies:
      - JP
      - SG
      - US
      - HK
  - type: select
    hidden: true
    name: Steam
    proxies:
      - DIRECT
      - JP
      - SG
      - US
      - HK
  - type: select
    hidden: true
    name: PikPak
    proxies:
      - SG
      - JP
      - US
      - HK
  - type: select
    hidden: true
    name: GitHub
    proxies:
      - JP
      - SG
      - US
      - HK
  - type: select
    hidden: true
    name: Microsoft
    proxies:
      - JP
      - SG
      - US
      - HK
  - type: select
    hidden: true
    name: TikTok
    proxies:
      - JP
  - type: select
    hidden: true
    name: Twitter
    proxies:
      - US
  - type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 30
    tolerance: 300
    timeout: 1000
    max-failed-times: 3
    include-all-proxies: true
    hidden: true
    name: HK
    filter: "(?i).*HK.*"
  - type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 30
    tolerance: 300
    timeout: 1000
    max-failed-times: 3
    include-all-proxies: true
    hidden: true
    name: JP
    filter: "(?i).*JP.*"
  - type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 30
    tolerance: 300
    timeout: 1000
    max-failed-times: 3
    include-all-proxies: true
    hidden: true
    name: SG
    filter: "(?i).*SG.*"
  - type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 30
    tolerance: 300
    timeout: 1000
    max-failed-times: 3
    include-all-proxies: true
    hidden: true
    name: US
    filter: "(?i).*US.*"
